<?xml version="1.0" encoding="UTF-8"?>
<!--
  GITATO icon sprite v2 — original artwork, drawn for this project.

  Replaces the 45+ OS emoji and stray geometric glyphs that were doing icon duty
  across the portfolio (📁 💾 🎬 ⚙ 👍 ⚔ ◆ ▸ …). Emoji render in the OS font, in
  full colour, at an optical weight nobody controls; these do not.

  GRID       24×24 viewBox, artwork inside a 20×20 optical box (2px breathing room).
  STROKE     currentColor, width 1.75, round cap + round join. Scales with font-size
             when you set width/height in em.
  FILL       none by default. A handful of marks are intentionally solid (play,
             record, dot) — those declare fill="currentColor" on the shape itself.
  USAGE      <svg class="gi"><use href="icons.svg#gi-save"/></svg>
             …or inline the whole sprite once and use href="#gi-save".

  Keep ids stable: they are referenced from every surface.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <defs>
    <style>
      symbol { --sw: 1.75; }
      symbol > * { fill: none; stroke: currentColor; stroke-width: var(--sw);
                   stroke-linecap: round; stroke-linejoin: round; }
      symbol > .solid { fill: currentColor; stroke: none; }
      symbol > .thin { stroke-width: 1.25; }
    </style>
  </defs>

